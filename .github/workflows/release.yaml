on:
  release:
    types: [created]

name: Create release assets

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # master
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          package-json-file: panel/package.json
          cache: false
          install: false

      - name: Build panel assets
        run: |
          cd panel
          pnpm install
          pnpm build

      - name: Create archive
        run: |
          zip -r "formwork-${TAG}.zip" . -x \
          \*.git/\* \
          \*.github/\* \
          \*node_modules/\* \
          \tests/\* \
          \phpunit.xml.dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "formwork-${TAG}.zip" --clobber
