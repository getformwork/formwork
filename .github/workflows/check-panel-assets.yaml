name: Check panel assets

on:
  push:
    branches:
      - 2.x
    paths:
      - "panel/src/**"

  pull_request:
    branches:
      - 2.x
    paths:
      - "panel/src/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          package-json-file: panel/package.json
          cache: true
          cache-dependency-path: panel/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          cd panel
          pnpm install

      - name: Check TypeScript
        run: |
          cd panel
          pnpm run check:ts

      - name: Check CSS
        run: |
          cd panel
          pnpm run check:css
