name: Check panel assets

on:
  push:
    branches:
      - 2.x
    paths:
      - "panel/src/**"
      - "panel/tests/**"

  pull_request:
    branches:
      - 2.x
    paths:
      - "panel/src/**"
      - "panel/tests/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          package-json-file: panel/package.json
          cache: true
          cache-dependency-path: panel/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          cd panel
          pnpm install

      - name: Check TypeScript
        run: |
          cd panel
          pnpm run check:ts

      - name: Check CSS
        run: |
          cd panel
          pnpm run check:css

      - name: Check types of tests
        run: |
          cd panel
          pnpm run test:types

      - name: Run tests
        run: |
          cd panel
          pnpm test
