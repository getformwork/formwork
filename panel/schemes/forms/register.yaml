title: Register

fields:
    fullname:
        type: text
        label: '{{user.fullname}}'
        required: true
        autocomplete: name

    username:
        type: text
        label: '{{user.username}}'
        suggestion: '{{panel.users.newUser.username.suggestion}}'
        required: true
        pattern: '[a-zA-Z][a-zA-Z0-9]*([\-._][a-zA-Z0-9]+)*'
        minLength: 3
        maxLength: 20
        autocomplete: username

    password:
        type: password
        label: '{{user.password}}'
        suggestion: '{{panel.users.newUser.password.suggestion}}'
        required: true
        minLength: 8
        autocomplete: new-password

    email:
        type: email
        label: '{{user.email}}'
        required: true
        autocomplete: email

    language:
        type: select
        label: '{{user.language}}'
        icon: translate
        required: true
        translate: [label]
        options@: formwork.panel.availableTranslations
        default: en
