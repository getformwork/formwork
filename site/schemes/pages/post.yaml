title: Blog Post

extend: pages.page

options:
    default: false
    children: false
    num: date
    imagePreviewField: coverImage

layout:
    sections:
        page:
            fields: [title, coverImage, taxonomy.tag, summary, content]

fields:
    summary:
        type: markdown
        label: '{{page.summary}}'
        rows: 5

    coverImage:
        type: image
        label: '{{page.image}}'

    taxonomy.tag:
        type: tags
        label: '{{page.tags}}'
        placeholder: '{{page.noTags}}'
